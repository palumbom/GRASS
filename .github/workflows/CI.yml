name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # keep the data restored from the cache; skip the Jupiter ephemeris (src/get_kernels.jl)
      GRASS_KEEP_DATA: true
      GRASS_SKIP_JUPITER: true
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Month for the data cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # downloaded files only: restoring tracked files under data/ would overwrite the checkout.
      # A new month misses the cache, which keeps the cached Earth PCK near GRASS's 30-day refresh.
      - uses: actions/cache@v4
        with:
          path: |
            data/input
            data/*.bsp
            data/*.bpc
            data/*.tls
            data/*.tpc
            data/*.tf
            data/LD_coeff_*.csv
            data/sunspots.csv
          key: grass-data-${{ hashFiles('deps/build.jl', 'src/get_kernels.jl') }}-${{ steps.month.outputs.month }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
