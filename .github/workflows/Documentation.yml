name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    env:
      # keep the data restored from the cache; skip the Jupiter ephemeris (src/get_kernels.jl)
      GRASS_KEEP_DATA: true
      GRASS_SKIP_JUPITER: true
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          # must lie inside the julia compat entry in Project.toml
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Month for the data cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # same key as CI.yml, so the two workflows share one cached copy of the downloaded data
      - uses: actions/cache@v4
        with:
          path: |
            data/input
            data/*.bsp
            data/*.bpc
            data/*.tls
            data/*.tpc
            data/*.tf
            data/LD_coeff_*.csv
            data/sunspots.csv
          key: grass-data-${{ hashFiles('deps/build.jl', 'src/get_kernels.jl') }}-${{ steps.month.outputs.month }}
      - name: Develop project
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: docs
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
